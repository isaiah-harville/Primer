---
# Text Embeddings Inference, CPU-only, serving an OpenAI-compatible
# /v1/embeddings - which is all Primer asks for.
#
# Every flag below cost debugging time somewhere. See
# docs/operations/models.md for the measurements.
#
#   --model-id      the ONNX export, not Qwen's own repository. That one
#                   publishes no ONNX, so TEI falls back to Candle and
#                   runs at roughly a quarter of the throughput - flat
#                   under batching and concurrency alike. Same vectors.
#   --pooling       required here and not on Qwen's repository, which
#                   ships the pooling config TEI reads. Qwen3-Embedding
#                   pools the last token; mean-pooling it returns
#                   plausible vectors that retrieve badly. TEI refuses to
#                   start rather than guess, which is the behaviour you
#                   want.
#   --max-batch-tokens        what warmup allocates against, so it is what
#                   an OOM at startup is usually made of.
#   --auto-truncate an over-long input is trimmed rather than failing the
#                   whole batch it arrived in.
#   --max-client-batch-size   at least what the client sends. Primer's
#                   document embedder sends 32; a lower ceiling rejects
#                   every ingestion batch with a 422.
#   --max-concurrent-requests counted in *inputs*, not requests: a POST
#                   carrying 32 inputs costs 32 against it. Below the
#                   client batch size, every ingestion batch gets a 429.
#
# The image tag is pinned rather than floating. TEI returned wrong vectors
# for Qwen3 until huggingface/text-embeddings-inference#648 - a bug that
# produces plausible embeddings and silently worse retrieval, which is the
# kind nobody notices. A model whose correctness depends on the server
# version should name the version it was verified against.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: primer-embeddings
  labels:
    app: primer-embeddings
spec:
  replicas: 1
  selector:
    matchLabels:
      app: primer-embeddings
  template:
    metadata:
      labels:
        app: primer-embeddings
    spec:
      containers:
        - name: tei
          image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.3
          args:
            - --model-id
            - onnx-community/Qwen3-Embedding-0.6B-ONNX
            - --pooling
            - last-token
            - --port
            - "8080"
            - --max-batch-tokens
            - "4096"
            - --auto-truncate
            - --max-client-batch-size
            - "32"
            - --max-concurrent-requests
            - "256"
          env:
            - name: HUGGINGFACE_HUB_CACHE
              value: /data
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
          resources:
            requests:
              cpu: "2"
              memory: 6Gi
            limits:
              memory: 16Gi
          volumeMounts:
            - name: model-cache
              mountPath: /data
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: primer-embeddings-model-cache
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: primer-embeddings-model-cache
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # 4Gi held the Candle safetensors with room to spare. The ONNX build
      # is bigger - model.onnx_data alone is 2.09GB - and lands beside them
      # rather than replacing them, which left 2.8GB free against a ~2.1GB
      # download. 10Gi is slack enough that this is not revisited.
      storage: 10Gi
  # storageClassName: your-storage-class
---
apiVersion: v1
kind: Service
metadata:
  name: primer-embeddings
  labels:
    app: primer-embeddings
spec:
  selector:
    app: primer-embeddings
  ports:
    - name: http
      port: 8080
      targetPort: 8080
