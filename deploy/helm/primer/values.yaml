# Primer, for a deployment other people use.
#
# This is the multi-user story. Compose is deliberately single-user; here is
# where the ingress, the identity provider, and the trusted-header boundary
# live.

image:
  # One image for the three API services, another for the worker: Docling
  # needs torch and torch has no musl wheels, so sharing would put a machine
  # learning stack in services that never import it.
  api:
    repository: ghcr.io/isaiah-harville/primer-api
    tag: ""          # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent
  worker:
    repository: ghcr.io/isaiah-harville/primer-worker
    tag: ""
    pullPolicy: IfNotPresent
  web:
    repository: ghcr.io/isaiah-harville/primer-web
    tag: ""
    pullPolicy: IfNotPresent
  pullSecrets: []

# --- Identity -----------------------------------------------------------
#
# Primer never validates a token. An authenticating proxy verifies the user
# against your provider and injects headers Primer trusts, which is why the
# ingress below strips those headers from inbound requests: without that,
# anyone could set them and be anyone.
auth:
  # Required. There is no default, because a chart that silently deployed a
  # shared, unauthenticated Primer into a cluster would be a trap.
  mode: oidc

  oidc:
    issuerUrl: ""
    clientId: ""
    # Referenced, never inlined. A secret in values.yaml ends up in
    # `helm get values`, in CI logs, and in whatever stores the release.
    existingSecret: ""
    clientSecretKey: client-secret
    cookieSecretKey: cookie-secret
    emailDomains:
      - "*"
    scopes: openid profile email groups

  proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
    replicas: 2
    # The workload in front of every request, so the scheduler should know
    # its size. It holds a session cookie and forwards; it is not where the
    # work happens.
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 256Mi }

# --- Ingress ------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  host: primer.example.com
  tlsSecret: primer-tls
  annotations: {}

# --- Data ---------------------------------------------------------------
#
# No database or broker is bundled. A chart that shipped its own PostgreSQL
# would be one people run in production by accident.
postgresql:
  existingSecret: ""
  urlKey: database-url

rabbitmq:
  existingSecret: ""
  urlKey: broker-url

sourceStore:
  # An fsspec URL. Object storage for more than one replica: a
  # ReadWriteOnce volume cannot be shared between nodes.
  url: s3://primer-sources
  # A Secret holding the backend's own environment - AWS_ACCESS_KEY_ID,
  # AWS_SECRET_ACCESS_KEY, FSSPEC_S3_ENDPOINT_URL for a non-AWS endpoint, and
  # anything else it wants. Every key is passed through, because those names
  # belong to the storage backend rather than to Primer.
  #
  # Mounted only into Control and the ingestion workers: nothing else opens a
  # source object.
  existingSecret: ""

# Settings this chart does not model, added to every Primer workload. An
# escape hatch, so a deployment that needs one variable does not need a fork
# or a post-renderer.
extraEnv: []
#  - name: HTTPS_PROXY
#    value: http://proxy.internal:3128

# --- Inference ----------------------------------------------------------
#
# Primer ships no model. These point at whatever you already run.
inference:
  chat:
    baseUrl: ""
    model: ""
    existingSecret: ""
    apiKeyKey: chat-api-key
    # How much of a conversation a follow-up question may recall.
    historyMessages: 20
    # The context window assumed for any model not named in
    # modelContextTokens, and how much of it is held back for the answer.
    contextTokens: 8192
    replyTokens: 1024
    # modelContextTokens:
    #   llama3.1:70b: 131072
    modelContextTokens: {}
    # Prompt size is estimated, not measured: no tokenizer is right for
    # every OpenAI-compatible endpoint. Lower this if it under-counts.
    charactersPerToken: 4.0
    # Summarize the turns that no longer fit instead of dropping them, and
    # the room reserved for that summary. Costs a model call whenever
    # something is actually dropped, which is the reason to turn it off.
    compactHistory: true
    summaryTokens: 512
  embeddings:
    baseUrl: ""
    model: ""
    # Must match the model. Changing it invalidates every stored vector.
    dimensions: 1536
    existingSecret: ""
    apiKeyKey: embedding-api-key

vectorStore:
  kind: pgvector          # pgvector | qdrant
  qdrantUrl: ""

# --- Tools --------------------------------------------------------------
tools:
  # Off by default, deployment-wide. Turning this on without a sandbox
  # declaration on each execution server is refused at startup.
  enabled: false
  servers: []

# --- Scale --------------------------------------------------------------
#
# Parsing is CPU-heavy and holds whole documents in memory; embedding mostly
# waits on a network call. They are separate deployments so each scales on
# what actually constrains it.
control:
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

retrieval:
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 2Gi }

chat:
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

web:
  replicas: 2
  # Above Control's max_upload_bytes (100MB default), so a legitimate upload
  # never gets rejected by the web server before Control gets to validate it.
  bodySizeLimit: 110M
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }

workers:
  parse:
    replicas: 1
    # Processes per pod, and the number `resources` below has to be sized
    # for. One, because a parse holds a whole document in memory and loads
    # Docling's layout models: two of those in one container is two copies
    # of both. Scale this component with replicas rather than here.
    concurrency: 1
    resources:
      requests: { cpu: 500m, memory: 2Gi }
      limits: { memory: 6Gi }
    # Docling downloads layout models on first use; without a persistent
    # cache every pod restart re-downloads half a gigabyte.
    modelCache:
      enabled: true
      size: 4Gi
      storageClass: ""
  index:
    replicas: 1
    # Higher, because this one mostly waits: embedding is a network call to
    # a model endpoint, and a process blocked on a socket is not using the
    # memory the limit is protecting.
    concurrency: 4
    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits: { memory: 2Gi }

# --- Availability -------------------------------------------------------
#
# What keeps the replicas above, rather than what sets them.
podDisruptionBudgets:
  # A budget is written only for a component that runs more than one
  # replica. On a single-replica component a budget of any kind makes the
  # pod unevictable, and a node drain that never finishes is a worse
  # failure than the restart it was avoiding.
  enabled: true
  # One at a time. With two replicas that is the strongest budget that
  # still lets a node be drained at all.
  maxUnavailable: 1

# Off unless asked for, and only for the services whose load is requests.
#
# The workers are deliberately not here. Their work arrives on a queue, and
# queue depth is the only signal that describes it: an embedding worker
# spends its time waiting on a network call, so its CPU is near zero
# precisely when the backlog is longest. Scaling those on CPU would add
# pods when they are busy computing and none when they are behind. Wire
# KEDA to the broker if you want them autoscaled, and set `workers.*.
# replicas` until then.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  # 0 leaves the metric off. Memory is a poor scaling signal for a Python
  # service - an interpreter that has grown does not give the memory back -
  # so this is here for deployments that have measured it, not as a default.
  targetMemoryUtilizationPercentage: 0
  # Per component, merged over the settings above. `enabled: true` here
  # turns one service on without turning on the rest.
  control: {}
  chat: {}
  retrieval: {}
  web: {}

# --- Migrations ---------------------------------------------------------
#
# A pre-upgrade hook, never an init container on each pod: several replicas
# racing to alter one schema is what this avoids.
migrations:
  enabled: true
  backoffLimit: 1
  # Alembic on one connection. It is short-lived and single-threaded, and
  # the limit is here so that every container in this chart has one.
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

# --- Identity and isolation ---------------------------------------------
serviceAccounts:
  # One account per component instead of the namespace default, so what a
  # workload may do is stated per workload and an audit log can tell them
  # apart. None of them is granted anything: nothing here calls the
  # Kubernetes API, and no token is mounted.
  create: true
  annotations: {}
  # Merged over the above, keyed by component: control, chat, retrieval,
  # web, auth, migrate, worker-parse, worker-index. The usual reason is
  # cloud IAM, and only the workloads that open a source object have any
  # business assuming a role that can read the bucket.
  perComponent: {}
    # worker-parse:
    #   eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/primer-sources

networkPolicies:
  # Ingress-only, and worth reading docs/operations/kubernetes.md before
  # turning this off. A policy does nothing at all on a cluster whose CNI
  # does not enforce NetworkPolicy - the objects are accepted and ignored -
  # which is a bad way to believe you are isolated.
  enabled: true
  # Who may reach the public entry point. Empty means any namespace, because
  # an ingress controller lives in a namespace this chart cannot know the
  # name of. Naming it narrows the only rule here that is wider than it
  # could be.
  ingress: []
    # - namespaceSelector:
    #     matchLabels:
    #       kubernetes.io/metadata.name: ingress-nginx
  # Whole NetworkPolicy objects, for a path this chart does not model - a
  # scraper reaching /metrics, say.
  extra: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
