[project]
name = "primer-ingestion"
version = "0.1.0"
description = "Primer ingestion workers: parsing, chunking, embedding, and indexing"
requires-python = ">=3.13"
dependencies = [
    "celery",
    "docling",
    "onnxruntime",
    "httpx2",
    "primer-contracts",
    "primer-observability",
    "primer-storage",
    "pydantic-settings",
    # Declared directly, though Docling is what needs them, so the workspace
    # can pin them to the CPU-only index. Left transitive, Linux resolves a
    # torch that bundles the entire CUDA toolkit for hardware Primer's
    # document parsing never touches.
    "torch",
    "torchvision",
]

[dependency-groups]
dev = [
    # Fixture generation only: a .pptx is a ZIP of related OOXML parts, and
    # hand-assembling one would test the generator rather than the parser.
    "python-pptx",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
primer-contracts = { workspace = true }
primer-observability = { workspace = true }
primer-storage = { workspace = true }
