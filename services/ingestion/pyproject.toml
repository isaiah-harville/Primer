[project]
name = "primer-ingestion"
version = "0.1.0"
description = "Primer ingestion workers: parsing, chunking, embedding, and indexing"
requires-python = ">=3.13"
dependencies = [
    "celery",
    "httpx2",
    "primer-contracts",
    "pydantic-settings",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
primer-contracts = { workspace = true }
