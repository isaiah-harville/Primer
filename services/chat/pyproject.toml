[project]
name = "primer-chat"
version = "0.1.0"
description = "Primer chat: cited, streamed answers grounded in a user's own library"
requires-python = ">=3.13"
dependencies = [
    "alembic",
    "asyncpg",
    "fastapi",
    "haystack-ai",
    "httpx2",
    "primer-contracts",
    "psycopg[binary]",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
]

[dependency-groups]
# Only needed when a deployment switches tools on. Kept out of the default
# install so a Chat service with tools off does not carry an MCP client, and
# so a missing optional dependency cannot stop it starting.
tools = [
    "mcp-haystack",
]
dev = [
    "testcontainers[postgres]",
]
server = [
    "uvicorn[standard]",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
primer-contracts = { workspace = true }
