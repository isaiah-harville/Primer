[project]
name = "primer-control"
version = "0.1.0"
description = "Primer Control API: public domain operations and authorization"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "primer-contracts",
    "pydantic-settings",
]

[dependency-groups]
dev = [
    "httpx2",
]
server = [
    "uvicorn[standard]",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
primer-contracts = { workspace = true }
