{{/*
The one secret this chart creates.

Everything else is referenced by name from a secret the operator already
manages, because a chart that generated database passwords would put them in
the release and in `helm get values`.

This one is different: it is Primer's own cluster-internal service token,
meaningful to nothing outside this release. It is generated once and then
preserved across upgrades - regenerating it on every `helm upgrade` would
leave in-flight workers holding a credential the API had just stopped
accepting.
*/}}
{{- $name := printf "%s-internal" (include "primer.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "primer.labels" . | nindent 4 }}
type: Opaque
data:
  internal-token: {{ if $existing }}{{ index $existing.data "internal-token" }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
