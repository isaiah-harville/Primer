{{/*
The one secret this chart creates.

Everything else is referenced by name from a secret the operator already
manages, because a chart that generated database passwords would put them in
the release and in `helm get values`.

This one is different: it is Primer's own cluster-internal service token,
meaningful to nothing outside this release. It is generated once and then
preserved across upgrades - regenerating it on every `helm upgrade` would
leave in-flight workers holding a credential the API had just stopped
accepting.
*/}}
{{/*
A hook, and not an ordinary resource, because the migration Jobs are
pre-install hooks that read this token. Helm applies ordinary manifests only
after every pre-install hook has succeeded, so on a fresh install those Jobs
would wait forever on a secret that cannot exist yet.

Weight -10 puts it ahead of the migrations at -5. The lookup above runs at
render time, before before-hook-creation deletes the previous copy, so the
token still survives an upgrade. The cost is that `helm uninstall` leaves
this secret behind - hooks are not part of the release manifest.
*/}}
{{- $name := printf "%s-internal" (include "primer.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "primer.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
data:
  internal-token: {{ if $existing }}{{ index $existing.data "internal-token" }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
