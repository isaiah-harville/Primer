[project]
name = "primer"
version = "0.1.0"
description = "Self-hosted, multi-user RAG research assistant"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "ty",
]

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["packages", "services", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "BLE", "UP", "ASYNC", "S", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages", "services"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ty.environment]
python-version = "3.13"
