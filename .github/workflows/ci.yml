name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancels superseded runs, except on main: cancelling a run mid-deploy can
  # leave Pages serving a half-published site.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  python:
    name: Python (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install

      - name: Sync workspace
        run: uv sync --all-packages --locked

      # Docling downloads its layout models on first conversion. Caching them
      # on the lock file keeps PDF parsing tested on every run without half a
      # gigabyte of downloads each time. A cache miss is slow, not broken.
      - name: Cache Docling models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: docling-models-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: docling-models-${{ runner.os }}-

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run ty check

      - name: Tests
        run: uv run pytest

  docs:
    name: Docs (generated, strict build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install

      - name: Sync workspace
        run: uv sync --all-packages --locked --group docs

      # The diagrams and the HTTP reference are generated. Regenerating them
      # and diffing catches the case where code changed and the docs
      # describing it did not.
      - name: Regenerate generated pages
        run: |
          uv run python scripts/generate_diagrams.py
          uv run python scripts/generate_api_reference.py

      - name: Check generated docs are current
        run: git diff --exit-code -- docs/

      - name: Build site
        run: uv run mkdocs build --strict

      # Uploaded from every run so a pull request proves the artefact builds,
      # but only the deploy job below is gated on main.
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish-docs:
    name: Docs (publish)
    needs: docs
    # Only from main, and only for this repository: a fork running this
    # workflow has no Pages site to publish to and would fail confusingly.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      # Required by the deploy action to mint its OIDC token; it is scoped to
      # this job alone rather than granted to the whole workflow.
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  web:
    name: Web (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome
        run: pnpm check

      - name: Svelte type check
        run: pnpm -r --if-present check

      - name: Tests
        run: pnpm test
